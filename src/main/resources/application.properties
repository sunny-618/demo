Spring.profiles.include=secret
management.endpoint.env.show-value=NEVER
spring.application.name=HelloWorld
spring.ai.openai.base-url=https://ws-lcy7psiaapxa9jql.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
spring.ai.openai.chat.options.model=qwen3.8-max

spring.ai.openai.embedding.options.model=qwen3.7-text-embedding
spring.ai.openai.embedding.options.dimensions=2048

#spring.ollama.base_url=http://localhost:1143
#spring.ai.ollama.chat.options.model=deepseek-r1:7b

spring.data.redis.client-type=jedis
spring.data.redis.url=redis://localhost:6379

spring.ai.model.embedding=openai
spring.ai.vectorstore.redis.initialize-schema=true
spring.ai.vectorstore.redis.index-name=java1234_ai_vctor_index
spring.ai.vectorstore.redis.prefix="java1234_"

logging.level.org.springframework.ai=debug


spring.datasource.url=jdbc:mysql://localhost:3306/demo?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.type-aliases-package=com.glz.spring.helloworld.entity
mybatis.configuration.map-underscore-to-camel-case=true

spring.mail.host=smtp.qq.com
spring.mail.port=465
spring.mail.username=1335161105@qq.com
spring.mail.default-encoding=UTF-8
spring.mail.protocol=smtp

# 关键：启用 SSL 并指定 Socket 工厂
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.fallback=false

# 可选：设置超时，避免线程无限阻塞
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000